name: smart_community
description: "Smart Community Management Platform RT - Mobile & Web"
publish_to: 'none'
# versionName + versionCode. Sumber tunggal, ter-commit dan ter-review —
# BUKAN bendera --build-name/--build-number, yang hanya menulis ke
# android/local.properties (gitignored) sehingga build berikutnya diam-diam
# kembali ke nilai lama. versionCode WAJIB naik pada setiap artefak yang
# dibagikan; Android menolak memasang versionCode yang sama atau lebih rendah.
# Lihat RELEASE-ANDROID.md.
version: 1.1.0+3

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Local Storage
  shared_preferences: 2.0.15

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.19.0
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  webview_flutter: ^4.14.1

  # QR Code
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  sqflite: ^2.4.3
  connectivity_plus: ^7.3.1
  path: ^1.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  path_provider: 2.0.15
  path_provider_foundation: 2.3.1
